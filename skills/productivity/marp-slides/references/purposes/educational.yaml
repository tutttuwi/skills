  - 練習
  - 解答と解説
  - 復習
preferred_layouts:
  - K01
  - K02
  - K03
  - K05
  - K06
  - K15
preferred_renderers:
  - svg
  - mermaid
  - katex
  - excalidraw
avoid:
  - 未定義の専門用語
  - 解説のない設問
