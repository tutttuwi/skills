  theme_aware: true
constraints:
  allow_overflow: false
  min_font_size: 22px
renderers:
  - html
  - css
selection_rules:
  suitable_for:
    - 上に結論を置き直下で根拠を示す
  unsuitable_for:
    - 一枚で複数の論点や詳細な根拠を読む必要がある
template: slide.md
stylesheet: ../../themes/base.css
preview: preview.png
preview_theme: minimal
