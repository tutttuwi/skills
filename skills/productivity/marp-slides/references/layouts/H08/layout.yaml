category: highlight
purpose:
  - 上に結論を置き直下で根拠を示す
layout:
  aspect_ratio: 16:9
  columns: 2
  arrangement: 見出しの下に内容を配置
  padding: 56px
  gap: 24px
structure:
  header:
    type: heading
    required: true
    max_lines: 2
  content:
