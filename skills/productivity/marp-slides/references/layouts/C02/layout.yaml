category: cards
purpose:
  - 項目の順序や優先度を番号で表す
layout:
  aspect_ratio: 16:9
  columns: 3
  arrangement: 見出しの下に内容を配置
  padding: 56px
  gap: 24px
structure:
  header:
    type: heading
    required: true
    max_lines: 2
  content:
    required: true
    guidance: 項目の順序や優先度を番号で表す
    slots: 区別できるラベルと一定の粒度の説明
visual:
  emphasis: 項目の順序や優先度を番号で表す
  theme_aware: true
constraints:
  allow_overflow: false
  min_font_size: 22px
renderers:
  - html
  - css
selection_rules:
  suitable_for:
    - 項目の順序や優先度を番号で表す
  unsuitable_for:
    - 項目の間の因果や順序を主張したい
template: slide.md
stylesheet: ../../themes/base.css
preview: preview.png
preview_theme: modern
